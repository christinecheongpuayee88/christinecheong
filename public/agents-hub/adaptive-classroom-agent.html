let outputs = {};

function uploadCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => { document.getElementById('survey').value = e.target.result; };
  reader.readAsText(file);
}

function flash(el) {
  el.style.borderColor = '#DC2626'; el.focus();
  setTimeout(() => el.style.borderColor = '', 1500);
}

function togglePivot() {
  const wrap = document.getElementById('pivotWrap');
  wrap.classList.toggle('show');
  if (wrap.classList.contains('show')) document.getElementById('pivotInput').focus();
}

async function callAPI(systemPrompt, userMsg) {
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userMsg }
      ],
      max_tokens: 1800
    })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'API error');
  const text = data.choices?.[0]?.message?.content
    || data.content?.[0]?.text
    || (typeof data.content === 'string' ? data.content : '')
    || '';
  if (!text) throw new Error('Empty response');
  return text;
}

function prependCard(id, headBg, dotColor, label, loadingBarClass) {
  const out = document.getElementById('outputs');
  const existing = document.getElementById(id);
  if (existing) existing.remove();
  const card = document.createElement('div');
  card.className = 'output-card';
  card.id = id;
  card.innerHTML = `
    <div class="card-head" style="background:${headBg};">
      <div class="card-dot" style="background:${dotColor};"></div>
      <span class="card-label" style="color:${dotColor};">${label}</span>
    </div>
    <div class="card-body">
      <div class="loading"><div class="loading-bar ${loadingBarClass}"></div><div class="dots"><span></span><span></span><span></span></div></div>
    </div>
    <div class="copy-row"><button class="copy-btn" onclick="copyOut('${id}')">Copy</button></div>`;
  out.prepend(card);
}

function setCardBody(id, html) {
  const clean = html.replace(/```html/gi,'').replace(/```/g,'').trim();
  document.getElementById(id).querySelector('.card-body').innerHTML = clean;
}

// ── SURVEY SUMMARY ──
async function runBrief() {
  const survey = document.getElementById('survey').value.trim();
  if (!survey) { flash(document.getElementById('survey')); return; }
  prependCard('card-brief', '#F5F3FF', '#6D28D9', '📋 Survey Summary', 'bar-brief');
  try {
    const text = await callAPI(PROMPTS.brief, `LEARNING SURVEY:\n${survey}`);
    outputs['card-brief'] = text;
    setCardBody('card-brief', text);
  } catch(err) {
    setCardBody('card-brief', `<p style="color:#DC2626">Error: ${err.message}</p>`);
  }
}

// ── TEACHING ORCHESTRATOR ──
async function runOrch() {

// ── LIVE PIVOT ──
async function runPivot() {
  const situation = document.getElementById('pivotInput').value.trim();
  if (!situation) { flash(document.getElementById('pivotInput')); return; }
  const survey = document.getElementById('survey').value.trim();
  const userMsg = survey
    ? `LEARNING SURVEY CONTEXT:\n${survey}\n\nSITUATION:\n${situation}`
    : `SITUATION:\n${situation}`;
  prependCard('card-pivot', '#FFF7ED', '#B45309', '🔄 Live Pivot', 'bar-pivot');
  document.getElementById('pivotWrap').classList.remove('show');
  try {
    const text = await callAPI(PROMPTS.pivot, userMsg);
    outputs['card-pivot'] = text;
    setCardBody('card-pivot', renderPivot(text));
  } catch(err) {
    setCardBody('card-pivot', `<p style="color:#DC2626">Error: ${err.message}</p>`);
  }
}

    setCardBody('card-close', `<p style="color:#DC2626">Error: ${err.message}</p>`);
  }
}

// ── PIVOT RENDERER (plain text → structured) ──
function renderPivot(text) {
  const sections = ["WHAT'S HAPPENING", "DO THIS NOW", "SAY THIS"];
  const colors = { "WHAT'S HAPPENING":"#F5F3FF", "DO THIS NOW":"#EFF6FF", "SAY THIS":"#F0FDF4" };
  let lines = {};
  sections.forEach(s => lines[s] = []);
  let current = null;
  text.split('\n').forEach(line => {
    const t = line.trim();
    const match = sections.find(s => t.toUpperCase().startsWith(s));
    if (match) { current = match; const rest = t.slice(match.length).replace(/^[:\-–\s]+/,''); if(rest) lines[match].push(rest); }
    else if (t && current) lines[current].push(t);
  });
  const hasContent = sections.some(s => lines[s].length > 0);
  if (!hasContent) return `<div style="white-space:pre-wrap;">${text}</div>`;
  return sections.map(s => {
    if (!lines[s].length) return '';
    return `<div style="background:${colors[s]};border-radius:8px;padding:12px 14px;margin-bottom:10px;">
      <div style="font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#6B7280;margin-bottom:5px;">${s}</div>
      <div style="font-size:0.9rem;line-height:1.7;">${lines[s].join('<br>')}</div>
    </div>`;
  }).join('');
}

// ── COPY ──
function copyOut(id) {
  const text = outputs[id] || document.getElementById(id)?.querySelector('.card-body')?.innerText || '';
  navigator.clipboard.writeText(text);
  const btn = document.querySelector(`#${id} .copy-btn`);
  if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 1500); }
}
</script>
